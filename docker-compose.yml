services:
    db:
        image: postgres:16
        container_name: mini-horta-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: mini_horta
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    web:
        build: .
        container_name: mini-horta-next
        environment:
            DATABASE_URL: ${DATABASE_URL}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL}
            BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL}
            STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
            STRIPE_STANDARD_PRICE_ID: ${STRIPE_STANDARD_PRICE_ID}
            STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID}
            NODE_ENV: ${NODE_ENV}
            NEXT_PUBLIC_APP_NAME: Horta Fácil
        ports:
            - "3000:3000"
        depends_on:
            - db

volumes:
    postgres_data:

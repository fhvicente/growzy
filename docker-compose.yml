services:
    db:
        image: postgres:16
        container_name: growzy-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: growzy
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    web:
        build:
            context: .
            args:
                BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
                BETTER_AUTH_URL: ${BETTER_AUTH_URL}
                BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL}
                STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
                STRIPE_STANDARD_PRICE_ID: ${STRIPE_STANDARD_PRICE_ID}
                STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID}
                NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        container_name: growzy-next
        environment:
            DATABASE_URL: ${DATABASE_URL}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL}
            BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL}
            STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
            STRIPE_STANDARD_PRICE_ID: ${STRIPE_STANDARD_PRICE_ID}
            STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID}
            NEXT_PUBLIC_APP_NAME: Growzy
        ports:
            - "3000:3000"
        depends_on:
            - db

volumes:
    postgres_data:
